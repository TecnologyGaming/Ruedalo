version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ruedalo_backend
    restart: always
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URL=${MONGO_URL}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@rideve.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin1234!}
    networks:
      - ruedalo_net
      - autoskm8_autoskm8-net

networks:
  ruedalo_net:
    driver: bridge
  autoskm8_autoskm8-net:
    external: true